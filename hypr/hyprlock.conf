$font    = ZedMono Nerd Font

$bg      = rgb(1d2021)
$surface = rgb(282828)
$fg      = rgb(ebdbb2)
$muted   = rgb(a89984)
$dim     = rgb(928374)
$accent  = rgb(e8c597)
$yellow  = rgb(d79921)
$orange  = rgb(fe8019)
$green   = rgb(b8bb26)
$red     = rgb(fb4934)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = smooth, 0.25, 0.1, 0.25, 1.0
    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 1.6, smooth
}

background {
    monitor =
    color = $bg
}

label {
    monitor =
    text = 󰌾
    color = $accent
    font_size = 24
    font_family = Symbols Nerd Font
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 118
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
}

shape {
    monitor =
    size = 340, 2
    color = $accent
    rounding = 0
    border_size = 0
    position = 0, 52
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] date +"%A, %-d %B"
    color = $muted
    font_size = 19
    font_family = $font
    position = 0, 22
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    rounding = 0

    inner_color = $surface
    outer_color = $accent
    check_color = $green
    fail_color = $red
    capslock_color = $orange

    font_color = $fg
    font_family = $font
    placeholder_text = <span foreground="##928374"><i>enter password</i></span>
    fail_text = <span foreground="##fb4934">$FAIL</span>  <b>[$ATTEMPTS]</b>

    dots_size = 0.26
    dots_spacing = 0.32
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    hide_input = false

    position = 0, -56
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:150] sh -c 'cat /sys/class/leds/*capslock*/brightness 2>/dev/null | grep -qx 1 && printf "\xef\x81\xb1  CAPS LOCK ON"'
    color = $orange
    font_size = 15
    font_family = $font
    position = 0, -112
    halign = center
    valign = center
}

label {
    monitor =
    text = <span foreground="##a89984">welcome back, </span><span foreground="##e8c597"><b>$USER</b></span>
    font_size = 17
    font_family = $font
    position = 0, -156
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = $dim
    font_size = 15
    font_family = $font
    onclick = hyprctl switchxkblayout all next
    position = 0, 34
    halign = center
    valign = bottom
}

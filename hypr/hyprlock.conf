# BACKGROUND
background {
    monitor =
    path = ~/files/pictures/wallpapers/gruvbox.jpg
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Clock background
shape {
    monitor =
    size = 720, 200
    color = rgba(40, 40, 40, 0.88)
    rounding = 12
    border_size = 0
    position = 0, 428
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(232, 197, 151, 1.0)
    font_size = 22
    font_family = SF Pro Display Bold
    position = 0, 500
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(232, 197, 151, 1.0)
    font_size = 90
    font_family = SF Pro Display Bold
    position = 0, 410
    halign = center
    valign = center
}


# INPUT FIELD
input-field {
    monitor =
    size = 650, 80
    rounding = 4
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(232, 197, 151, 0.4)
    inner_color = rgba(40, 40, 40, 0.5)
    font_color = rgb(232, 197, 151)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##e8c59799"></span></i>
    hide_input = false
    position = 0, -400
    halign = center
    valign = center
}
